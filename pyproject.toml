[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-copilot-mcp"
version = "0.0.0"
description = "Natural-language queries over ERP data — the reference extension for in-process tools, an agent over the core's single chat surface, and ambiguity resolved by asking."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Albanna Software Solutions", email = "ahmedalbanna966@gmail.com" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["ai_copilot_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../albanna-ai-chat"]
addopts = "-q"
